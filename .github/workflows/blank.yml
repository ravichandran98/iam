name: RDS Snapshot Cleanup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'pre-prod'
        type: choice
        options:
          - pre-prod
          - prod

jobs:
  preprod:
    name: Pre-Prod Cleanup (Dry Run or other logic)
    runs-on: ubuntu-latest
    if: ${{ inputs.environment == 'pre-prod' }}
    environment: pre-prod

    steps:
      - name: Checkout (if needed)
        uses: actions/checkout@v3

      - name: Pre-Prod step
        run: |
          echo "🏗️ This is the PRE-PROD job."
          echo "Performing dry-run or just listing snapshots..."
          aws rds describe-db-snapshots \
            --snapshot-type manual \
            --query 'DBSnapshots[*].DBSnapshotIdentifier' \
            --output table

  prod:
    name: Prod Cleanup (Actual Snapshot Deletion)
    runs-on: ubuntu-latest
    if: ${{ inputs.environment == 'prod' }}
    environment: prod

    steps:
      - name: Checkout (if needed)
        uses: actions/checkout@v3

      - name: Delete manual RDS snapshots older than 30 days
        run: |
          THIRTY_DAYS_AGO=$(date -d '0 days ago' --utc +%s)

          echo "🔍 Fetching manual RDS snapshots older than 30 days..."

          aws rds describe-db-snapshots \
            --snapshot-type manual \
            --query 'DBSnapshots[*].{ID:DBSnapshotIdentifier, Time:SnapshotCreateTime}' \
            --output json | jq -c '.[]' |
          while read -r snapshot; do
            SNAPSHOT_ID=$(echo "$snapshot" | jq -r '.ID')
            SNAPSHOT_TIME=$(echo "$snapshot" | jq -r '.Time')
            SNAPSHOT_EPOCH=$(date -d "$SNAPSHOT_TIME" --utc +%s)

            if [ "$SNAPSHOT_EPOCH" -lt "$THIRTY_DAYS_AGO" ]; then
              echo "🗑️ Deleting snapshot: $SNAPSHOT_ID (created on $SNAPSHOT_TIME)"
              aws rds delete-db-snapshot --db-snapshot-identifier "$SNAPSHOT_ID"
              sleep 10
            else
              AGE=$(( ($(date +%s) - SNAPSHOT_EPOCH) / 86400 ))
              echo "⏭️ Skipping snapshot: $SNAPSHOT_ID (only $AGE days old)"
            fi
          done
