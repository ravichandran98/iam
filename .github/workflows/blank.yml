name: Delete RDS Snapshots Older Than 1 Day (No jq)

on: 
  workflow_dispatch:      # Allows manual trigger

jobs:
  delete-old-snapshots:
    runs-on: ubuntu-latest

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: AKIAWOAVSJSJMM3HJCTS
        aws-secret-access-key: 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
        aws-region: eu-west-1

    - name: Delete Snapshots Older Than 1 Day
      run: |
        THRESHOLD_DATE=$(date -d "2 day ago" --iso-8601=seconds)
        START_DATE=$(date -d "0 day ago" --iso-8601=seconds)
        echo "Looking for snapshots older than: $THRESHOLD_DATE"

        SNAPSHOTS=$(aws rds describe-db-snapshots \
          --snapshot-type manual \
          --query "DBSnapshots[?SnapshotCreateTime>=\`${THRESHOLD_DATE}\`&& ?SnapshotCreateTime<=`${START_DATE}`].DBSnapshotIdentifier" \
          --output text)
        echo "$SNAPSHOTS"

